<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../design/Style.css">
    <script src="../JS/Common.js" defer></script>
    <script src="../JS/Patient.js" defer></script>

    <title>Registration - LifeFlow</title>
</head>

<body>
    <div class="container">

        <div class="header">
            <h1>LifeFlow</h1>
            <h3>Patient Registration</h3>
        </div>

        <h2>Registration Information</h2>

        <form onsubmit="return signUp()" novalidate>

            <fieldset>
                <legend>Personal Information</legend>

                <table>
                    <tr>
                        <td>
                            <label for="PatientName">Patient Name:</label>
                        </td>
                        <td>
                            <input type="text" id="PatientName"
                                name="PatientName"
                                placeholder="Enter Your Name">
                            <p id="NameError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="PatientAge">Patient Age:</label>
                        </td>
                        <td>
                            <input type="number" id="PatientAge"
                                name="PatientAge"
                                placeholder="Enter Your Age">
                            <p id="AgeError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="PatientEmail">Patient Email:</label>
                        </td>
                        <td>
                            <input type="email" id="PatientEmail"
                                name="PatientEmail"
                                placeholder="Enter Your Email">
                            <p id="EmailError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label>Gender:</label>
                        </td>
                        <td>
                            <input type="radio" id="Male"
                                name="Gender" value="Male">
                            Male

                            <input type="radio" id="Female"
                                name="Gender" value="Female">
                            Female

                            <p id="GenderError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Phone">Phone Number:</label>
                        </td>
                        <td>
                            <input type="text" id="Phone"
                                name="Phone"
                                placeholder="Enter Phone Number">
                            <p id="PhoneError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Address">Address:</label>
                        </td>
                        <td>
                            <textarea id="Address" name="Address"
                                placeholder="Enter Your Address"></textarea>
                            <p id="AddressError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Citizenship">Citizenship:</label>
                        </td>
                        <td>
                            <select id="Citizenship" name="Citizenship">
                                <option value="">Select Citizenship</option>
                                <option value="Bangladeshi">Bangladeshi</option>
                                <option value="Indian">Indian</option>
                                <option value="Pakistani">Pakistani</option>
                                <option value="Nepalese">Nepalese</option>
                                <option value="Other">Other</option>
                            </select>
                            <p id="CitizenshipError"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>


            <fieldset>
                <legend>User Profile</legend>

                <table>
                    <tr>
                        <td>
                            <label for="Username">Username:</label>
                        </td>
                        <td>
                            <input type="text" id="Username"
                                name="Username"
                                placeholder="Enter Your Username">
                            <p id="UsernameError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="Password">Password:</label>
                        </td>
                        <td>
                            <input type="password" id="Password"
                                name="Password"
                                placeholder="Enter Your Password">
                            <p id="PasswordError"></p>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="ConfirmPassword">
                                Confirm Password:
                            </label>
                        </td>
                        <td>
                            <input type="password" id="ConfirmPassword"
                                name="ConfirmPassword"
                                placeholder="Confirm Your Password">
                            <p id="ConfirmPasswordError"></p>
                        </td>
                    </tr>
                </table>
            </fieldset>


            <input type="button" id="save" value="Save"
                onclick="saveProfile()">

            <input type="button" id="Reset" value="Reset"
                onclick="resetProfile()">

            <input type="submit" id="signup" value="Sign Up">

            <p id="Message"></p>

        </form>

        <div class="footer">
            <h5>LifeFlow - Blood Donation Network </h5>
        </div>

    </div>
</body>
</html>
