<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeFlow - Post Blood Request</title>

    <link rel="stylesheet" href="../design/Style.css">

    <script src="../JS/Common.js" defer></script>
    <script src="../JS/Patient.js" defer></script>
</head>

<body class="request-page">

    <!-- Header -->
    <div class="header">
        <h1>LifeFlow</h1>
        <h3>Patient Portal</h3>
    </div>

    <!-- Navigation Bar -->
    <div class="topnav">
        <a href="PatientRegistration.html">Home</a>
        <a href="PatientDashboard.html">Dashboard</a>
        <a href="PostBloodRequest.html" class="active">Post Request</a>
        <a href="SearchDonors.html">Search Donor</a>
        <a href="PatientRequestHistory.html">Request History</a>
    </div>

    <!-- Main Container -->
    <div class="container">

        <h2>Blood Request Information</h2>

        <form id="RequestForm" onsubmit="return submitRequest()" novalidate>

            <!-- Patient Information -->
            <fieldset>
                <legend>Patient Information</legend>

                <table class="form-table">
                    <tr>
                        <td><label for="PatientName">Patient Name:</label></td>
                        <td>
                            <input type="text" id="PatientName" name="PatientName"
                                placeholder="Enter patient name">
                            <span id="NameError" class="error-msg"></span>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Phone">Phone Number:</label></td>
                        <td>
                            <input type="text" id="Phone" name="Phone"
                                maxlength="11" placeholder="Enter phone number">
                            <span id="PhoneError" class="error-msg"></span>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="BloodGroup">Blood Group:</label></td>
                        <td>
                            <select id="BloodGroup" name="BloodGroup">
                                <option value="">Select Blood Group</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                            <span id="BloodError" class="error-msg"></span>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Units">Required Units:</label></td>
                        <td>
                            <input type="number" id="Units" name="Units"
                                min="1" max="20" placeholder="Enter required units">
                            <span id="UnitsError" class="error-msg"></span>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <!-- Hospital Information -->
            <fieldset>
                <legend>Hospital Information</legend>

                <table class="form-table">
                    <tr>
                        <td><label for="Hospital">Hospital Name:</label></td>
                        <td>
                            <input type="text" id="Hospital" name="Hospital"
                                placeholder="Enter hospital name">
                            <span id="HospitalError" class="error-msg"></span>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="District">District:</label></td>
                        <td>
                            <select id="District" name="District">
                                <option value="">Select District</option>
                                <option value="Dhaka">Dhaka</option>
                                <option value="Chattogram">Chattogram</option>
                                <option value="Cumilla">Cumilla</option>
                                <option value="Gazipur">Gazipur</option>
                                <option value="Other">Other</option>
                            </select>
                            <span id="DistrictError" class="error-msg"></span>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Address">Hospital Address:</label></td>
                        <td>
                            <textarea id="Address" name="Address" rows="3" style="resize: none;"
                                placeholder="Enter hospital address"></textarea>
                            <span id="AddressError" class="error-msg"></span>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <!-- Request Details -->
            <fieldset>
                <legend>Request Details</legend>

                <table class="form-table">
                    <tr>
                        <td><label for="RequiredDate">Required Date:</label></td>
                        <td>
                            <input type="date" id="RequiredDate" name="RequiredDate">
                            <span id="DateError" class="error-msg"></span>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Urgency">Urgency Level:</label></td>
                        <td>
                            <select id="Urgency" name="Urgency">
                                <option value="">Select Urgency</option>
                                <option value="Normal">Normal</option>
                                <option value="Urgent">Urgent</option>
                                <option value="Critical">Critical</option>
                            </select>
                            <span id="UrgencyError" class="error-msg"></span>
                        </td>
                    </tr>

                    <tr>
                        <td><label for="Information">Additional Information:</label></td>
                        <td>
                            <textarea id="Information" name="Information" rows="3" style="resize: none;"
                                placeholder="Enter additional information (optional)"></textarea>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <!-- Buttons -->
            <div class="btn-group">
                <input type="button" id="save" value="Submit" onclick="saveProfile()">
                <input type="button" value="Reset" onclick="resetRequest()">
            </div>

            <p id="Message"></p>

        </form>
    </div>

    <!-- Footer -->
    <div class="footer">
        <h5>LifeFlow - Blood Donation Network</h5>
    </div>

</body>
</html>
