<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../Design/Style.css">
    <script src="../JS/volBloodReq.js"></script>

    <title> Volunteer Donor Blood Request Page </title>
</head>


    
<body>
    <div class="container">

        <div class="header">
            <h1> Lifeflow </h1>
            <h2> Volunteer Donor Blood Request Page </h2>
        </div>

        <br>

        <div class="topnav">
            <a class="VAnchor" href="../../index.html"> Home </a>
            <a class="VAnchor" href="VolunteerHome.html"> Donor Page </a>
            <a class="VAnchor" href="VolunteerReg.html"> Registration </a>
            <a class="VAnchor" href="VolunteerLogIn.html"> Login </a>
            <a class="VAnchor" id="VRequestAnchor" href="VolunteerBloodReq.html"> Request </a>
            <a class="VAnchor" href="VolunteerProfile.html"> Profile </a>
            <a class="VAnchor" href="VolunteerDonationHistory.html"> History </a>
        </div>

        <br>


        <div class="Requestintro">
            <p id="RequestintroP">Blood Request</p>
        </div>

        <br>

        <form onsubmit="return show_accept1()" novalidate>
            <fieldset>
                <legend> Blood Request </legend>
                <table id="formTable">
                    <tr>
                        <td class="formTD"> <label for="ReqBloodGroupLabel" class="formLabel"> Blood Group </label> </td>
                        <td>:</td>
                        <td class="formTD"> <label>O+</label></td>
                    </tr>
            
                    <tr>
                        <td class="formTD"> <label for="ReqLocationLabel" class="formLabel"> Location </label> </td>
                        <td>:</td>
                        <td class="formTD"> <label>Kurmitola, Dhaka</label></td>
                    </tr>
            
            
                    <tr>
                        <td class="formTD"> <label for="ReqHnameLabel" class="formLabel"> Hospital Name </label> </td>
                        <td>:</td>
                        <td class="formTD"> <label>Kurmitola General Hospital</label></td>
                    </tr>
            
                    <tr>
                        <td class="formTD"> <label for="ReqUrgencyLabel" class="formLabel"> Urgency </label> </td>
                        <td>:</td>
                        <td class="formTD"> <label>Urgent</label></td>
                    </tr>

                    <tr>
                        <td class="formTD"> <label id="AcceptShow1" for="AcceptShow1" class="formLabel"> </label> </td>
                    </tr>
            
                </table>

                <br>

                <input type="submit" id="submit" for="Submit" value="Accept">
                
            </fieldset>
        </form>    
        
        <form onsubmit="return show_accept2()" novalidate>
           <fieldset>
                <legend> Blood Request </legend>
                <table id="formTable">
                    <tr>
                        <td class="formTD"> <label for="ReqBloodGroupLabel2" class="formLabel"> Blood Group </label> </td>
                        <td>:</td>
                        <td class="formTD"> <label>O+</label></td>
                    </tr>
            
                    <tr>
                        <td class="formTD"> <label for="ReqBloodLocationLabel2" class="formLabel"> Location </label> </td>
                        <td>:</td>
                        <td class="formTD"> <label>Khilkhet, Dhaka</label></td>
                    </tr>
            
            
                    <tr>
                        <td class="formTD"> <label for="ReqHnameLabel2" class="formLabel"> Hospital Name </label> </td>
                        <td>:</td>
                        <td class="formTD"> <label>Khilkhet General Hospital</label></td>
                    </tr>
            
                    <tr>
                        <td class="formTD"> <label for="ReqUrgencyLabel2" class="formLabel"> Urgency </label> </td>
                        <td>:</td>
                        <td class="formTD"> <label>Urgent</label></td>
                    </tr>

                    <tr>
                        <td class="formTD"> <label id="AcceptShow2" for="AcceptShow2" class="formLabel"> </label> </td>
                    </tr>
            
                </table>

                <br>

                <input type="submit" id="submit" for="Submit" value="Accept">
            </fieldset>
        </form>    
            
        

        <br>

        <div class="footer">
            <h4> LifeFlow Voluntary Donor Portal , Created by Sayed Sadman Shahriar </h4>
        </div>
    </div>
</body>

</html>
