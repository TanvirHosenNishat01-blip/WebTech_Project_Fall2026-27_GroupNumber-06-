<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../Design/Style.css">
    <script src="../JS/volHistory.js"></script>

    <title> Donor Blood Donation History </title>
</head>



<body>
    <div class="container">

        <div class="header">
            <h1> Lifeflow </h1>
            <h2> Donor Blood Donation History </h2>
        </div>

        <br>

        <div class="topnav">
            <a class="VAnchor" href="../../index.html"> Home </a>
            <a class="VAnchor" href="VolunteerHome.html"> Donor Page </a>
            <a class="VAnchor" href="VolunteerReg.html"> Registration </a>
            <a class="VAnchor" href="VolunteerLogIn.html"> Login </a>
            <a class="VAnchor" href="VolunteerBloodReq.html"> Request </a>
            <a class="VAnchor" href="VolunteerProfile.html"> Profile </a>
            <a class="VAnchor" id="VHistoryAnchor" href="VolunteerDonationHistory.html"> History </a>
        </div>

        <br>


        <div class="Historyintro">
            <p id="HistoryintroP">My Blood Donation History</p>
        </div>

        <br>

        <form onsubmit="return history_collect_data()" novalidate>
            <fieldset>
                <legend> Add Donation Record </legend>
                <table id="formTable">

                    <tr>
                        <td class="formTD"> <label for="DDate" class="formLabel"> Donation Date </label> </td>
                        <td class="formTD"> <label>:</label> </td>
                        <td class="formTD"> <input type="date" for="DDate" id="DDate" name="DDate"> 
                            <p id="DDateError" class="errorMsg"> </p>
                        </td>
                    </tr>


                    <tr>
                        <td class="formTD"> <label for="Hospitalname" class="formLabel"> Hospital Name </label> </td>
                        <td class="formTD"> <label>:</label></td>
                        <td class="formTD"> <input type="text" for="Hospitalname" id="Hospitalname" name="Hospitalname"
                                placeholder="Enter Hospital Name">
                            <p id="HospitalNameError" class="errorMsg"> </p>
                        </td>
                    </tr>


                    <tr>
                        <td class="formTD"> <label for="totalNumBag" class="formLabel">  Total Number of Bags </label> </td>
                        <td class="formTD"> <label>:</label></td>
                        <td class="formTD"> <input type="number" for="totalNumBag" id="totalNumBag" name="PatientAge"
                                placeholder="Enter Number">
                            <p id="totalNumBagError" class="errorMsg"> </p>
                        </td>
                    </tr>

                </table>
            </fieldset>

            <input type="submit" id="submit" for="Submit" value="ADD">
            <input type="reset" id="reset" for="reset">
            <br><br>

            <fieldset>
                <legend> Last Donation History </legend>
                <table>
                    <tr>
                        <td class="formTD"> <label for="DonDate" class="formLabel"> Donation Date  </label> </td>
                        <td>:</td>
                        <td class="formTD"> 
                            <label id="ShowDonationDate"> </label>
                        </td>
                    </tr>


                    <tr>
                        <td class="formTD"> <label for="ShowHospitalName" class="formLabel"> Hospital Name  </label> </td>
                        <td>:</td>
                        <td class="formTD">
                            <label id="ShowHName"> </label>
                        </td>
                    </tr>


                    <tr>
                        <td class="formTD"> <label for="Shownum" class="formLabel">  Total Number of Bags  </label> </td>
                        <td>:</td>
                        
                        <td class="formTD">
                            <label id="ShowNum"> </label>
                        </td>
                    </tr>
                </table>
            </fieldset>
            

            

        </form>

        <br>

        <div class="footer">
            <h4> LifeFlow Voluntary Donor Portal , Created by Sayed Sadman Shahriar </h4>
        </div>
    </div>
</body>

</html>
