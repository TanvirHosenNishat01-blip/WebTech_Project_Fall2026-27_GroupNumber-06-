<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../Design/Style.css">
    <script src="../JS/volReg.js"></script>

    <title> Volunteery Donor Registration Form </title>
</head>



    

<body>
    <div class="container">

        <div class="header">
            <h1> Lifeflow </h1>
            <h2> Volunteer Donor Registration Form </h2>
        </div>

        <br>

        <div class="topnav">

            <a class="VAnchor" href=""> Home </a>
            <a class="VAnchor" href="VolunteerHome.html"> Donor Page </a>
            <a class="VAnchor" id="VregAnchor" href="VolunteerReg.html"> Registration </a>
            <a class="VAnchor" href="VolunteerLogIn.html"> Login </a>
            <a class="VAnchor" href="VolunteerBloodReq.html"> Request </a>
            <a class="VAnchor" href="VolunteerProfile.html"> Profile </a>
            <a class="VAnchor" href="VolunteerDonationHistory.html"> History </a>
        </div>

        <br>


        <div class="Regintro">
            <p id="RegintroP">Donor Registration Form</p>
        </div>


        <br>

        <form onsubmit="return registration_collect_data()" novalidate>
            <fieldset>
                <legend> Information </legend>
                <table id="formTable">
                    <tr>
                        <td class="formTD"> <label for="VolunteerName" class="formLabel"> Name </label> </td>
                        <td class="formTD"> <label>:</label></td>
                        <td class="formTD"> <input type="text" for="VolunteerName" id="VolunteerName" name="VolunteerName"
                                placeholder="Enter Your Name">
                            <p id="NameError" class="errorMsg"> </p>
                        </td>
                    </tr>

                    <tr>
                        <td class="formTD"> <label for="VolunteerAge" class="formLabel"> Age </label> </td>
                        <td class="formTD"> <label>:</label></td>
                        <td class="formTD"> <input type="number" for="VolunteerAge" id="VolunteerAge" name="VolunteerAge"
                                placeholder="Enter Your Age">
                            <p id="AgeError" class="errorMsg"> </p>
                        </td>
                    </tr>


                    <tr>
                        <td class="formTD"> <label for="VolunteerEmail" class="formLabel"> Email Adrress </label> </td>
                        <td class="formTD"> <label>:</label> </td>
                        <td class="formTD"> <input type="email" for="VolunteerEmail" id="VolunteerEmail" name="VolunteerEmail"
                                placeholder="Enter Your Email">
                            <p id="EmailError" class="errorMsg"> </p>
                        </td>
                    </tr>

                    <tr>
                        <td class="formTD"> <label for="Gender" class="formLabel"> Gender </label> </td>
                        <td class="formTD"> <label>:</label> </td>
                        <td class="formTD">
                            <input type="radio" id="Male" name="Gender" value="Male"> Male
                            <input type="radio" id="Female" name="Gender" value="Female"> Female
                            <p id="GenderError" class="errorMsg"></p>
                        </td>
                    </tr>

                    

                    <tr>
                        <td class="formTD"> <label for="DOB" class="formLabel"> Date of Birth </label> </td>
                        <td class="formTD"> <label>:</label> </td>
                        <td class="formTD"> 
                            <input type="date" for="DOB" id="DOB" name="DOB"> 
                            <p id="dobError" class="errorMsg"></p>
                        </td>
                    </tr>

                    <tr>
                        <td class="formTD"> <label for="BloodGroup" class="formLabel"> Blood Group </label> </td>
                        <td class="formTD"> <label>:</label> </td>
                        <td class="formTD">
                            <select id="BloodGroup" name="BloodGroup">
                                <option id="blank"> Select Your Blood Group </option>
                                <option id="AP"> A+ </option>
                                <option id="AN"> A- </option>
                                <option id="BP"> B+ </option>
                                <option id="BN"> B- </option>
                                <option id="OP"> O+ </option>
                                <option id="ON"> O- </option>
                            </select>
                            <p id="BloodGroupError" class="errorMsg"></p>
                        </td>
                    </tr>

                    <tr>
                        <td class="formTD"> <label for="Address" class="formLabel"> Present Address: </label> </td>
                        <td class="formTD"> <label>:</label> </td>
                        <td class="formTD">
                            <textarea for="Address" id="Address" name="Address" style="resize: none;"> </textarea>
                            <p id="AddressError" class="errorMsg"></p>
                        </td>
                    </tr>


                    <tr>
                        <td class="formTD"> <label for="Document" class="formLabel"> Profile Picture </label> </td>
                        <td class="formTD"> <label>:</label> </td>
                        <td class="formTD"> <input type="file" for="Document" id="Document" name="Document"> </td>
                    </tr>

                    <tr>
                        <td class="formTD"> <input type="checkbox" id="Condition" name="ConditionBox" value="Condition"> <label class="formLabel"> I agree to the terms and conditions. </label>
                            <p id="ConditionError" class="errorMsg"></p>
                        </td>
                    </tr>


                </table>
            </fieldset>

            <fieldset>
                <legend> User Profile </legend>
                <table>
                    <tr>
                        <td class="formTD"> <label for="UserName" class="formLabel"> User Name: </label> </td>
                        <td class="formTD"> <label>:</label> </td>
                        <td class="formTD"> <input type="text" for="UserName" id="UserName" name="UserName"
                                placeholder="Enter Your User Name"> 
                                <p class="errorMsg" id="UsernameError"></p>
                            </td>
                    </tr>

                    <tr>
                        <td class="formTD"> <label for="Password" class="formLabel"> Password: </label> </td>
                        <td class="formTD"> <label>:</label> </td>
                        <td class="formTD"> <input type="password" for="Password" id="Password" name="Password"
                                placeholder="Enter Your Password"> 
                                <p class="errorMsg" id="PasswordError"></p>
                            </td>
                    </tr>
                </table>
            </fieldset>
            

            <input type="submit" id="submit" for="Submit" value="Signup">
            <input type="reset" id="reset" for="reset">

        </form>

        <br>

        <div class="footer">
            <h4> LifeFlow Voluntary Donor Portal , Created by Sayed Sadman Shahriar </h4>
        </div>
    </div>
</body>

</html>
